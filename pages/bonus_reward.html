<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>额外加赠奖励</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

/* 舞台（固定2340x1080，JS动态缩放） */
.stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}

/* 背景层 */
.bg-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}

/* 奖励道具静态图片 */
.reward-item{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);max-width:60%;max-height:55%;object-fit:contain;z-index:10;opacity:0;animation:rewardIn 0.6s ease-out 0.2s forwards}

/* 道具名字 */
.reward-name{position:absolute;top:78%;left:50%;transform:translate(-50%,-4em);font-size:48px;font-weight:bold;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.8),0 0 20px rgba(255,200,50,0.5);z-index:11;white-space:nowrap;opacity:0;animation:nameIn 0.6s ease-out 0.5s forwards;letter-spacing:2px}

@keyframes rewardIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

@keyframes nameIn{
  0%{opacity:0;transform:translate(-50%,calc(-4em + 20px))}
  100%{opacity:1;transform:translate(-50%,-4em)}
}

/* 确定按钮（透明热区） */
.confirm-btn{position:absolute;left:40%;top:82%;width:20%;height:10%;background:transparent;border:none;cursor:pointer;z-index:100}
</style>
<style>

/* ===== 防止浏览器暗夜模式自动反转颜色 ===== */
:root {
  color-scheme: light only;
  -webkit-color-scheme: light only;
}
html {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
}
body {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
  -webkit-lightness-adjust: none !important;
}
/* 防止图片被反转 */
img {
  -webkit-filter: none !important;
  filter: none !important;
}
/* ============================================ */

</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg-layer" id="bgImg" src="../images/common/bonus/extra/reward_bg.png" alt="额外加赠奖励">
  <img class="reward-item" id="rewardItem" src="" alt="奖励道具">
  <div class="reward-name" id="rewardName"></div>
  <button class="confirm-btn" id="confirmBtn"></button>
</div>

<script src="../data/item_base_name_map.js"></script>
<script src="../data/item_mapping.js"></script>
<script src="../data/item_box_config.js"></script>
<script src="../data/image_utils.js"></script>
<script>
// 自适应缩放
function layout(){
  var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2340*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

// 额外加赠道具静态图片映射表


// 当前奖励
var currentReward = null;

// 显示奖励
function showReward(item){
  currentReward = item;
  var rewardItem = document.getElementById('rewardItem');
  var rewardName = document.getElementById('rewardName');
  
  // 设置道具名字
  rewardName.textContent = item.name;
  
  // 获取道具静态图片
  var imageUrl = getBonusImage(item.name);
  if(!imageUrl && item.image){
    imageUrl = item.image;
  }
  
  if(imageUrl){
    rewardItem.src = imageUrl;
    rewardItem.style.display = 'block';
  }else{
    rewardItem.style.display = 'none';
  }
}

// 确定按钮点击
document.getElementById('confirmBtn').addEventListener('click', function(){
  parent.postMessage({type: 'bonusRewardConfirm', item: currentReward}, '*');
});

// 监听ESC键
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    parent.postMessage({type: 'bonusRewardConfirm', item: currentReward}, '*');
  }
});

// 监听父页面的消息，接收奖励
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'setBonusReward' && e.data.item){
    showReward(e.data.item);
  }
});
</script>

<script>
// 禁止长按弹出菜单
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  return false;
});
// 禁止图片拖拽
document.addEventListener('dragstart', function(e){
  if(e.target.tagName === 'IMG'){
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
