<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>神话臻藏夺宝模拟器</title>
<style>
/* ===== CSS变量（神话臻藏金色主题） ===== */
:root{
  --primary-color: #c41e3a;
  --primary-color-rgb: 196,30,58;
  --primary-color-light: #e85a71;
  --accent-color: #ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
.stage{position:absolute;top:50%;left:50%;width:2340px;height:1080px;margin:-540px 0 0 -1170px;transform-origin:center center;cursor:pointer}
.layer{position:absolute;inset:0;width:2340px;height:1080px;pointer-events:none;user-select:none;-webkit-user-drag:none;display:block}
.layer-bg{z-index:1}
.layer-weapon{z-index:2;animation:weaponFloat 4s ease-in-out infinite;will-change:transform;filter:drop-shadow(0 0 25px rgba(100,140,255,.3))}
@keyframes weaponFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.btn-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.hotspot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:10px;transition:transform .12s ease,background .12s ease}
.hotspot:active{transform:scale(.93);background:rgba(255,215,0,.12)}
.hotspot.pulse{animation:btnPulse 2s ease-in-out infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,50,.5)}50%{box-shadow:0 0 0 18px rgba(255,200,50,0)}}
.ripple{position:absolute;border-radius:50%;border:3px solid rgba(255,200,50,.9);background:radial-gradient(circle,rgba(255,220,100,.25) 0%,rgba(255,180,0,.08) 60%,transparent 100%);transform:translate(-50%,-50%) scale(0);animation:rippleExpand .7s cubic-bezier(.1,.8,.3,1) forwards;pointer-events:none;z-index:100;box-shadow:0 0 24px rgba(255,200,50,.5),0 0 48px rgba(255,180,0,.25)}
@keyframes rippleExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(7);opacity:0}}
.particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:100}
.flash{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,210,.9) 0%,rgba(255,220,100,.35) 40%,transparent 70%);transform:translate(-50%,-50%) scale(0);animation:flashBurst .55s ease-out forwards;pointer-events:none;z-index:99}
@keyframes flashBurst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(1.6);opacity:.7}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
.shockwave{position:absolute;border-radius:50%;border:2px solid rgba(255,230,120,.6);transform:translate(-50%,-50%) scale(0);animation:shockwaveExpand .8s ease-out forwards;pointer-events:none;z-index:98}
@keyframes shockwaveExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:.8}100%{transform:translate(-50%,-50%) scale(10);opacity:0}}

.hotspot,
.hotspot:active,
.hotspot:hover,
.hotspot:focus,
.hotspot.pulse,
.hotspot.selected{
  border:none!important;
  background:transparent!important;
  outline:none!important;
  box-shadow:none!important;
  animation:none!important;
}
.hotspot-label{display:none!important}

.exchange-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:none;align-items:center;justify-content:center}
.exchange-modal.active{display:flex}
.exchange-box{position:relative;width:92%;height:88%;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,.8)}
.exchange-box iframe{width:100%;height:100%;border:none;display:block;background:#000}

.fs-btn{position:fixed;top:12px;right:12px;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid rgba(var(--primary-color-rgb),.5);color:var(--primary-color);font-size:26px;cursor:pointer;z-index:99999;display:flex;align-items:center;justify-content:center;transition:all .2s}

/* 背景音乐音量调节（垂直） */
.bgm-volume-control{position:fixed;top:72px;right:12px;width:32px;height:120px;background:rgba(0,0,0,.65);border:1px solid rgba(var(--primary-color-rgb),.4);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 0;z-index:99999;transition:all .2s}
.bgm-volume-control:hover{background:rgba(0,0,0,.8);border-color:rgba(var(--primary-color-rgb),.7)}
.bgm-volume-icon{font-size:14px;margin-bottom:6px;flex-shrink:0}
.bgm-volume-slider{-webkit-appearance:none;appearance:none;width:80px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;cursor:pointer;transform:rotate(-90deg);transform-origin:center center;margin-top:30px}
.bgm-volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--primary-color);cursor:pointer;border:2px solid #fff;box-shadow:0 0 4px rgba(var(--primary-color-rgb),.6)}
.bgm-volume-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--primary-color);cursor:pointer;border:2px solid #fff;box-shadow:0 0 4px rgba(var(--primary-color-rgb),.6)}
/* 全屏时隐藏全屏按钮和音量调节 */
:fullscreen .fs-btn, :fullscreen .bgm-volume-control,
:-webkit-full-screen .fs-btn, :-webkit-full-screen .bgm-volume-control{display:none !important}
/* 页面说明文字 */
.page-info{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#ccc;font-size:12px;line-height:1.5;padding:6px 20px;z-index:99998;text-align:left}
.disclaimer-box{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#999;font-size:12px;line-height:1.6;padding:10px 20px;z-index:99998;text-align:left;border-top:1px solid rgba(255,255,255,0.1)}
.page-info .title{color:var(--primary-color);font-size:13px;font-weight:bold;margin-bottom:2px}
.page-info .guide{margin-bottom:2px}
.page-info .guide p{margin:0}
.page-info .disclaimer{color:#999;font-size:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:8px}
.fs-btn:hover{background:rgba(var(--primary-color-rgb),.2);transform:scale(1.1)}
.fs-btn:active{transform:scale(.92)}
body.is-fullscreen .fs-btn{display:none!important}
body.is-fullscreen .page-info{display:none!important}
body.is-fullscreen .disclaimer-box{display:none!important}

.gacha-single-modal.gacha-show{display:flex!important}
.gacha-single-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}
.gacha-single-box iframe{width:100%;height:100%;border:none;display:block;background:#000}

.gacha-tpl{display:none!important}

.shop-modal.shop-show{display:flex!important}
.shop-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}

.shop-tpl{display:none!important}
.recharge-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100006;display:none;align-items:center;justify-content:center}
.recharge-modal.recharge-show{display:flex!important}
.recharge-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}
.recharge-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
.confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100007;display:none;align-items:center;justify-content:center}
.confirm-modal.confirm-show{display:flex!important}
.confirm-box{position:relative;width:100vw;height:calc(100vw * 1344 / 2912);max-height:100vh;max-width:calc(100vh * 2912 / 1344);background:#000;overflow:hidden}
.confirm-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
.payment-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100008;display:none;align-items:center;justify-content:center}

.payment-box{position:relative;width:100vw;height:calc(100vw * 1344 / 2912);max-height:100vh;max-width:calc(100vh * 2912 / 1344);background:#000;overflow:hidden}

.exchange-confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100009;display:none;align-items:center;justify-content:center}
.exchange-confirm-modal.exchange-confirm-show{display:flex!important}
.exchange-confirm-box{position:relative;width:100vw;height:calc(100vw * 1344 / 2912);max-height:100vh;max-width:calc(100vh * 2912 / 1344);background:#000;overflow:hidden}
.exchange-confirm-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
.reward-modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,0.85)}
.reward-modal.show{display:block}
#rewardIframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.storage-modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,0.85)}
.storage-modal.show{display:block}

.decompose-reward-modal{position:fixed;inset:0;z-index:600;display:none;background:rgba(0,0,0,0.85)}
.warehouse-multi-modal{position:fixed;inset:0;z-index:600;display:none;background:rgba(0,0,0,0.85)}

#warehouseMultiIframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.warehouse-modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,0.85)}
.storage-modal iframe{width:100%;height:100%;border:none;display:block;background:#000}
.warehouse-modal iframe{width:100%;height:100%;border:none;display:block;background:#000}
.warehouse-modal.show{display:block}
.decompose-reward-modal.show{display:block}
#decomposeRewardIframe{position:absolute;inset:0;width:100%;height:100%;border:none}

/* 购买抽奖币成功弹窗 */
.buy-success-modal{position:fixed;inset:0;z-index:999999;background:#000;display:none;align-items:center;justify-content:center}
.buy-success-modal.show{display:flex!important}
.buy-success-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}
.buy-success-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
/* 额外加赠提示弹窗 */
.bonus-tip-modal{position:fixed;inset:0;z-index:999998;background:#000;display:none;align-items:center;justify-content:center}
.bonus-tip-modal.show{display:flex!important}
.bonus-tip-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}

/* 额外加赠奖励弹窗 */

/* 神话加赠提示弹窗 */

.mythic-tip-modal.show{display:flex!important}
.mythic-tip-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}

/* 神话加赠奖励弹窗 */
.mythic-reward-modal{position:fixed;inset:0;z-index:999995;background:#000;display:none;align-items:center;justify-content:center}
.mythic-reward-modal.show{display:flex!important}
.mythic-reward-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}
.mythic-reward-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
/* ===== 灰蓝金属确认弹窗（兑换失败用） ===== */
.sb-confirm-panel{
  width:45%;max-width:500px;
  background:linear-gradient(160deg,#8a92a8 0%,#6a7288 30%,#5a6278 60%,#4a5268 100%);
  border-radius:4px;
  position:relative;overflow:hidden;
  padding:4vh 3vw 3vh;
  box-shadow:0 0 60px rgba(0,0,0,0.6);
}
.sb-confirm-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#c03030,#e04040,#c03030);
}
.sb-confirm-cflogo{
  position:absolute;top:1.5vh;left:2vw;
  font-size:3vh;font-weight:bold;color:#d04040;
  opacity:0.6;letter-spacing:1px;
}
.sb-confirm-content{
  text-align:center;padding:3vh 0;
}
.sb-confirm-content p{
  font-size:3vh;color:#fff;line-height:1.8;
  text-shadow:0 1px 2px rgba(0,0,0,0.5);
}
.sb-confirm-btns{
  display:flex;gap:2vw;justify-content:center;
  padding-top:2vh;
}
.sb-btn-gold{
  padding:1.5vh 4vw;
  background:linear-gradient(180deg,#ffe080,#d4a030 50%,#a07018);
  border:1px solid #805010;border-radius:3px;
  color:#3a2800;font-size:2.8vh;font-weight:bold;
  cursor:pointer;
  box-shadow:0 0.4vh 1.5vh rgba(200,150,30,0.4);
}
.sb-btn-gold:active{transform:scale(0.97);}

/* ===== 加载页面样式（神话臻藏白红主题） ===== */
#loadingOverlay{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:#000;
  z-index:9999;
  transition:opacity 0.5s ease;
}
#loadingOverlay.hidden{
  opacity:0;
  pointer-events:none;
}
/* 加载界面容器（和模拟器stage一样，2340x1080，自适应缩放居中） */
#loadingStage{
  position:absolute;
  top:0;
  left:0;
  width:2340px;
  height:1080px;
  transform-origin:top left;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0a0a1a;
  overflow:hidden;
}
/* 首页背景图模糊层 */
.loading-bg{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:url('images/common/home/bg.png') center/cover no-repeat;
  filter:blur(8px) brightness(0.6);
  transform:scale(1.1);
  z-index:0;
  pointer-events:none;
}
/* 背景网格线效果（白红） */
#loadingStage::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:
    linear-gradient(rgba(var(--primary-color-rgb),0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(var(--primary-color-rgb),0.06) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
  z-index:1;
}
/* 旋转光晕效果（白红） */
#loadingStage::after{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle,rgba(var(--primary-color-rgb),0.1) 0%,transparent 50%);
  animation:rotateGlow 15s linear infinite;
  pointer-events:none;
  z-index:1;
}
@keyframes rotateGlow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
/* Logo文字样式（艺术字效果，白红主题） */
.loading-logo{
  font-size:168px;
  font-weight:900;
  letter-spacing:24px;
  margin-bottom:120px;
  position:relative;
  z-index:1;
  /* 白红渐变文字填充（白→金→橙） */
  background:linear-gradient(180deg,#ffffff 0%,var(--primary-color-light) 30%,var(--primary-color) 60%,var(--accent-color) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  /* 白红发光效果 */
  text-shadow:
    0 0 20px rgba(var(--primary-color-rgb),0.8),
    0 0 40px rgba(var(--primary-color-rgb),0.5),
    0 4px 8px rgba(0,0,0,0.8);
  /* 轻微呼吸动画 */
  animation:logoGlow 3s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{
    text-shadow:
      0 0 20px rgba(var(--primary-color-rgb),0.8),
      0 0 40px rgba(var(--primary-color-rgb),0.5),
      0 4px 8px rgba(0,0,0,0.8);
  }
  50%{
    text-shadow:
      0 0 30px rgba(var(--primary-color-rgb),1),
      0 0 60px rgba(var(--primary-color-rgb),0.7),
      0 4px 8px rgba(0,0,0,0.8);
  }
}
/* 加载阶段文字 */
.loading-stage{
  font-size:84px;
  color:var(--primary-color);
  margin-bottom:90px;
  margin-bottom:90px;
  min-height:120px;
  position:relative;
  z-index:1;
  text-shadow:0 0 15px rgba(var(--primary-color-rgb),0.5);
}
/* 进度条容器 */
.loading-bar-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  margin-bottom:40px;
}
.loading-bar-container{
  width:1600px;
  height:48px;
  background:rgba(255,255,255,0.1);
  border-radius:24px;
  overflow:hidden;
  position:relative;
  z-index:1;
  border:4px solid rgba(var(--primary-color-rgb),0.4);
  box-shadow:0 0 20px rgba(var(--primary-color-rgb),0.2);
}
/* 进度条填充（白红色渐变） */
.loading-bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent-color) 0%,var(--primary-color) 50%,var(--primary-color-light) 100%);
  border-radius:20px;
  transition:width 0.3s ease;
  position:relative;
  box-shadow:0 0 15px rgba(var(--primary-color-rgb),0.6);
}
/* 进度条内部箭头效果 */
.loading-bar-fill::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 20px,
    rgba(255,255,255,0.15) 20px,
    rgba(255,255,255,0.15) 40px
  );
  animation:arrowMove 1s linear infinite;
}
@keyframes arrowMove{
  from{background-position:0 0}
  to{background-position:40px 0}
}
/* 进度百分比 */
.loading-percent{
  font-size:72px;
  color:var(--primary-color-light);
  font-weight:bold;
  position:relative;
  flex-shrink:0;
  min-width:180px;
  text-align:left;
  z-index:1;
  text-shadow:0 0 10px rgba(var(--primary-color-rgb),0.5);
}
/* 提示文字 */
.loading-tip{
  font-size:56px;
  color:#ccaa66;
  margin-top:60px;
  position:relative;
  z-index:1;
}

/* ===== 加载页面美化增强 ===== */
/* 装饰性四角线条 */
.loading-corner{
  position:absolute;
  width:160px;
  height:160px;
  border:6px solid rgba(var(--primary-color-rgb),0.6);
  z-index:2;
  pointer-events:none;
}
.loading-corner-tl{top:80px;left:80px;border-right:none;border-bottom:none;}
.loading-corner-tr{top:80px;right:80px;border-left:none;border-bottom:none;}
.loading-corner-bl{bottom:80px;left:80px;border-right:none;border-top:none;}
.loading-corner-br{bottom:80px;right:80px;border-left:none;border-top:none;}

/* 环形加载动画容器 */
.loading-spinner-container{
  position:relative;
  width:200px;
  height:200px;
  margin-bottom:80px;
  z-index:2;
}
/* 环形背景 */
.loading-spinner-bg{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
  border:12px solid rgba(var(--primary-color-rgb),0.2);
  border-radius:50%;
}
/* 环形进度（旋转动画） */
.loading-spinner{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
  border:12px solid transparent;
  border-top-color:var(--primary-color);
  border-right-color:var(--primary-color-light);
  border-radius:50%;
  animation:spin 1.2s linear infinite;
  box-shadow:0 0 20px rgba(var(--primary-color-rgb),0.4);
}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
/* 环形中心光点 */
.loading-spinner-center{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:40px;
  height:40px;
  background:radial-gradient(circle,var(--primary-color-light) 0%,var(--primary-color) 100%);
  border-radius:50%;
  box-shadow:0 0 15px rgba(var(--primary-color-rgb),0.8);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  50%{transform:translate(-50%,-50%) scale(1.3);opacity:0.7;}
}

/* 进度条末端光点 */
.loading-bar-fill::before{
  content:'';
  position:absolute;
  top:50%;
  right:-16px;
  transform:translateY(-50%);
  width:40px;
  height:40px;
  background:radial-gradient(circle,#fff 0%,var(--primary-color-light) 40%,transparent 70%);
  border-radius:50%;
  box-shadow:0 0 20px var(--primary-color-light),0 0 40px var(--primary-color);
  animation:glowDot 1s ease-in-out infinite;
}
@keyframes glowDot{
  0%,100%{opacity:1;transform:translateY(-50%) scale(1);}
  50%{opacity:0.7;transform:translateY(-50%) scale(1.2);}
}

/* 进度条流光效果 */
.loading-bar-fill{
  overflow:hidden;
}
.loading-bar-shine{
  position:absolute;
  top:0;left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.4) 50%,transparent 100%);
  animation:shine 2s ease-in-out infinite;
}
@keyframes shine{
  0%{left:-100%;}
  100%{left:100%;}
}

/* 加载阶段文字渐入动画 */
.loading-stage{
  animation:fadeInUp 0.5s ease-out;
}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

/* 加载页面装饰横线 */
.loading-divider{
  width:600px;
  height:4px;
  background:linear-gradient(90deg,transparent 0%,rgba(var(--primary-color-rgb),0.6) 50%,transparent 100%);
  margin:40px 0;
  z-index:2;
  position:relative;
}

/* ============================================ */

stage.style.transform='scale('+s+')';

// 加载页面逻辑
var loadingBarFill = document.getElementById('loadingBarFill');
var loadingPercent = document.getElementById('loadingPercent');
var loadingStageText = document.getElementById('loadingStageText');
var loadingOverlay = document.getElementById('loadingOverlay');
var loadProgress = 0;
var loadStages = ['正在初始化···','正在加载页面资源···','正在加载图片资源···','正在加载音效资源···','加载完成！'];
var stageIndex = 0;

function updateLoading(){
  loadProgress += Math.random() * 8 + 2;
  if(loadProgress > 100) loadProgress = 100;
  if(loadingBarFill) loadingBarFill.style.width = loadProgress + '%';
  if(loadingPercent) loadingPercent.textContent = Math.floor(loadProgress) + '%';
  
  var newStageIndex = Math.min(Math.floor(loadProgress / 25), loadStages.length - 1);
  if(newStageIndex !== stageIndex){
    stageIndex = newStageIndex;
    if(loadingStageText) loadingStageText.textContent = loadStages[stageIndex];
  }
  
  if(loadProgress >= 100){
    setTimeout(function(){
      if(loadingOverlay){
        loadingOverlay.classList.add('hidden');
        setTimeout(function(){ loadingOverlay.style.display = 'none'; }, 500);
      }
    }, 300);
  }else{
    setTimeout(updateLoading, 100 + Math.random() * 150);
  }
}
setTimeout(updateLoading, 200);

function spawnEffect(cx,cy,intense){
intense=intense||1;
var flash=document.createElement('div');flash.className='flash';flash.style.left=cx+'px';flash.style.top=cy+'px';stage.appendChild(flash);setTimeout(function(){flash.remove()},550);
var ripple=document.createElement('div');ripple.className='ripple';ripple.style.left=cx+'px';ripple.style.top=cy+'px';ripple.style.width=(70*intense)+'px';ripple.style.height=(70*intense)+'px';stage.appendChild(ripple);setTimeout(function(){ripple.remove()},700);
var sw=document.createElement('div');sw.className='shockwave';sw.style.left=cx+'px';sw.style.top=cy+'px';sw.style.width='50px';sw.style.height='50px';stage.appendChild(sw);setTimeout(function(){sw.remove()},800);
var colors=['#ffd700','#ffec8b','#ffa500','#fff4b0','#ff8c00','#ffe46a'];
var count=Math.round(16*intense);
for(var i=0;i<count;i++){
var p=document.createElement('div');p.className='particle';p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=colors[i%colors.length];p.style.boxShadow='0 0 10px '+colors[i%colors.length]+',0 0 20px rgba(255,170,0,.5)';stage.appendChild(p);
var angle=(Math.PI*2*i)/count+Math.random()*0.4;var dist=(70+Math.random()*100)*intense;var dx=Math.cos(angle)*dist;var dy=Math.sin(angle)*dist;
p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale(0)',opacity:0}],{duration:650+Math.random()*350,easing:'cubic-bezier(.1,.8,.3,1)'});
(function(el){setTimeout(function(){el.remove()},1000)})(p);
}
}

function getStageXY(cx,cy){
var rect=stage.getBoundingClientRect();
var sx=2340/rect.width,sy=1080/rect.height;
return {x:(cx-rect.left)*sx,y:(cy-rect.top)*sy};
}

var hotspots=document.querySelectorAll('.hotspot');
hotspots.forEach(function(btn){
btn.addEventListener('click',function(e){
e.stopPropagation();
var p=getStageXY(e.clientX,e.clientY);
var name=btn.getAttribute('data-name');
var intense=(name==='抽奖1次'||name==='抽奖10次')?1.4:1;
spawnEffect(p.x,p.y,intense);
});
});

stage.addEventListener('click',function(e){
if(e.target.closest('.hotspot'))return;
var p=getStageXY(e.clientX,e.clientY);
spawnEffect(p.x,p.y,0.8);
});
})();

function needShowcase(item){
  return item && item.name && SHOWCASE_ITEMS.indexOf(item.name) !== -1;
}
function showSendToWarehouseReward(items){
  warehouseAllItems = items || [];
  if(warehouseAllItems.length === 0) return;
  
  // 重置分批显示状态
  warehouseCurrentBatch = 0;

  if(needExpand){

    pendingWarehouseItems = warehouseAllItems.slice();

    iframe.onload = function(){

  }else{

    warehouseTotalBatches = Math.ceil(warehouseAllItems.length / 10);
    showWarehouseBatch(0);
  }

// 显示指定批次的道具
function showWarehouseBatch(batchIndex){
  // 计算当前批次的道具（最多10个）
  var start = batchIndex * 10;
  var end = Math.min(start + 10, warehouseAllItems.length);
  pendingWarehouseItems = warehouseAllItems.slice(start, end);
  
  var multiIframe = document.getElementById('warehouseMultiIframe');
  var multiModal = document.getElementById('warehouseMultiModal');
  multiModal.classList.remove('show');
  playRewardSound(); // 播放恭喜获得页面音效

  multiIframe.onload = function(){

    setTimeout(function(){
      multiModal.classList.add('show');
    }, 100);
  };
}
// 发放仓库确认后，分批处理
function confirmSendToWarehouse(){
  // 把当前批次的道具加入已确认列表
  var currentBatchItems = pendingWarehouseItems.slice();
  warehouseConfirmedItems = warehouseConfirmedItems.concat(currentBatchItems);
  
  warehouseCurrentBatch++;
  
  // 如果还有下一批，显示下一批
  if(warehouseCurrentBatch < warehouseTotalBatches){
    // 关闭当前多道具显示页面，然后显示下一批
    var multiModal = document.getElementById('warehouseMultiModal');
    if(multiModal) multiModal.classList.remove('show');
    var multiIframe = document.getElementById('warehouseMultiIframe');
    if(multiIframe){
      multiIframe.onload = null;
      setTimeout(function(){
        multiIframe.src = 'about:blank';
        // 显示下一批
        setTimeout(function(){
          showWarehouseBatch(warehouseCurrentBatch);
        }, 100);
      }, 200);
    }else{
      showWarehouseBatch(warehouseCurrentBatch);
    }
    return;
  }
  
  // 所有批次都确认完了，把所有已确认的道具加入仓库
  var itemsToAdd = warehouseConfirmedItems.slice();
  itemsToAdd.forEach(function(newItem){
    var existing = warehouseItems.find(function(x){ return x.name === newItem.name; });
    if(existing){
      existing.count = (existing.count || 1) + (newItem.count || 1);
    }else{
      warehouseItems.push(newItem);
    }
  });
  
  // 从暂存箱扣除道具（支持count>1的情况）
  var itemsToDeduct = {};
  itemsToAdd.forEach(function(item){
    if(!itemsToDeduct[item.name]){
      itemsToDeduct[item.name] = 0;
    }
    itemsToDeduct[item.name] += (item.count || 1);
  });
  
  for(var deductName in itemsToDeduct){
    var countToDeduct = itemsToDeduct[deductName];
    for(var j = storageItems.length - 1; j >= 0; j--){
      if(storageItems[j].name === deductName){
        if(storageItems[j].count && storageItems[j].count > countToDeduct){
          storageItems[j].count -= countToDeduct;
        }else{
          storageItems.splice(j, 1);
        }
        break;
      }
    }
  }
  
  // 重置状态
  pendingWarehouseItems = [];
  warehouseAllItems = [];
  warehouseCurrentBatch = 0;
  warehouseTotalBatches = 0;
  warehouseConfirmedItems = [];
  
  // 通知暂存箱页面更新
  setTimeout(function(){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'sendToWarehouseSuccess', items: storageItems}, '*');
    }
  }, 50);
  
  // 最后关闭多道具显示页面
  setTimeout(function(){
    var multiModal = document.getElementById('warehouseMultiModal');
    if(multiModal) multiModal.classList.remove('show');
    var multiIframe = document.getElementById('warehouseMultiIframe');
    if(multiIframe){
      multiIframe.onload = null;
      setTimeout(function(){
        multiIframe.src = 'about:blank';
      }, 200);
    }
  }, 100);
  
  // 不关闭暂存箱，让用户可以继续操作
}
// 关闭购买抽奖币成功弹窗
function closeBuySuccess(){
  document.getElementById('buySuccessModal').classList.remove('show');
  var iframe = document.getElementById('buySuccessIframe');
  iframe.onload = null;

  if(typeof pendingWarehouseItems !== 'undefined' && pendingWarehouseItems.length === 1){

  }
}

<script>
// 抽奖动画状态锁，防止快速点击导致黑屏
var isGachaAnimating = false;
var gachaOpenTimeout = null;
var gachaTenOpenTimeout = null;
var gachaCloseTimeout = null;
var gachaTenCloseTimeout = null;
var currentGachaType = null; // 当前抽奖类型：single / ten

var gachaSingleTpl = document.getElementById('gachaSingleTpl').value;
var gachaTenTpl = document.getElementById('gachaTenTpl').value;



// 更新加载进度
function updateLoading(percent, stageText){
  var barFill = document.getElementById('loadingBarFill');
  var percentEl = document.getElementById('loadingPercent');
  var stageEl = document.getElementById('loadingStageText');
  if(barFill) barFill.style.width = percent + '%';
  if(percentEl) percentEl.textContent = Math.round(percent) + '%';
  if(stageEl && stageText) stageEl.textContent = stageText;
}

// ========== 预加载功能 ==========
var PRELOAD_RESOURCES = [];
// 收集所有图片和音效路径
(function collectResources(){
  // 收集images文件夹下的所有图片
  var imageExts = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg'];
  var audioExts = ['.m4a', '.mp3', '.wav', '.ogg', '.aac', '.flac'];
  
  // 从道具盒子配置中收集图片
  if(window.ITEM_BOX_CONFIG){
    for(var key in window.ITEM_BOX_CONFIG){
      var box = window.ITEM_BOX_CONFIG[key];
      if(box.small) PRELOAD_RESOURCES.push(box.small);
      if(box.big) PRELOAD_RESOURCES.push(box.big);
      if(box.showcase) PRELOAD_RESOURCES.push(box.showcase);
      if(box.bonus) PRELOAD_RESOURCES.push(box.bonus);
    }
  }
  
  // 去重
  PRELOAD_RESOURCES = [...new Set(PRELOAD_RESOURCES)];
})();

function forceDecodeImage(img) {
  return new Promise(function(resolve) {
    try {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      canvas.width = img.naturalWidth || 1;
      canvas.height = img.naturalHeight || 1;
      ctx.drawImage(img, 0, 0);
      resolve();
    } catch(e) {
      resolve();
    }
  });
}

function preloadKeyPages() {
  var keyPages = [
    'pages/gacha_single.html?preload=1',
    'pages/gacha_ten.html?preload=1',
    'pages/storage.html',
    'pages/warehouse.html',
    'pages/exchange.html',
    'pages/buy_confirm.html',
    'pages/bonus_tip.html?preload=1',
    'pages/confirm.html'
  ];
  window._preloadedIframes = window._preloadedIframes || {};
  
  keyPages.forEach(function(path) {
    try {
      var iframe = document.createElement('iframe');
      iframe.src = path;
      iframe.style.display = 'none';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = 'none';
      iframe.style.position = 'absolute';
      iframe.style.left = '-9999px';
      iframe.style.top = '-9999px';
      iframe.setAttribute('muted', '');
      iframe.setAttribute('volume', '0');
      iframe.setAttribute('data-preloaded', 'true');
      iframe.setAttribute('data-page', path);
      document.body.appendChild(iframe);
      window._preloadedIframes[path] = iframe;
    } catch(e) {}
  });
}

var preloadLoadedCount = 0;
var preloadTotalCount = PRELOAD_RESOURCES.length;
var preloadFinished = false;

function onPreloadResourceLoaded(path) {
  preloadLoadedCount++;
  var percent = (preloadLoadedCount / preloadTotalCount) * 100;
  var stageText = '已加载 ' + preloadLoadedCount + '/' + preloadTotalCount;
  if (percent < 30) stageText = '正在加载图片资源··· (' + preloadLoadedCount + '/' + preloadTotalCount + ')';
  else if (percent < 60) stageText = '正在加载音效资源··· (' + preloadLoadedCount + '/' + preloadTotalCount + ')';
  else if (percent < 90) stageText = '正在初始化游戏··· (' + preloadLoadedCount + '/' + preloadTotalCount + ')';
  else stageText = '即将完成··· (' + preloadLoadedCount + '/' + preloadTotalCount + ')';
  
  if (typeof updateLoading === 'function') {
    updateLoading(percent, stageText);
  }
  
  if (preloadLoadedCount >= preloadTotalCount && !preloadFinished) {
    preloadFinished = true;
    if (typeof updateLoading === 'function') {
      updateLoading(100, '加载完成！');
    }
    var loadingOverlay = document.getElementById('loadingOverlay');
    if (loadingOverlay) {
      loadingOverlay.classList.add('hidden');
      loadingOverlay.style.display = 'none';
    }
  }
}

// 开始预加载
preloadKeyPages();

PRELOAD_RESOURCES.forEach(function(path) {
  var ext = path.split('.').pop().toLowerCase();
  if (ext === 'm4a' || ext === 'mp3' || ext === 'wav' || ext === 'ogg' || ext === 'aac' || ext === 'flac') {
    var audio = new Audio();
    audio.preload = 'auto';
    audio.oncanplaythrough = function() { onPreloadResourceLoaded(path); };
    audio.onerror = function() { console.warn('预加载失败:', path); onPreloadResourceLoaded(path); };
    audio.src = path;
  } else {
    var img = new Image();
    img.onload = function() { 
      forceDecodeImage(img).then(function() {
        onPreloadResourceLoaded(path);
      });
    };
    img.onerror = function() { console.warn('预加载失败:', path); onPreloadResourceLoaded(path); };
    img.src = path;
  }
});

// 如果没有资源需要预加载，直接关闭加载页面
if(PRELOAD_RESOURCES.length === 0){
  setTimeout(function(){
    var loadingOverlay = document.getElementById('loadingOverlay');
    if (loadingOverlay) {
      loadingOverlay.classList.add('hidden');
      loadingOverlay.style.display = 'none';
    }

// ========== 额外加赠逻辑 ==========
// 检查是否满足额外加赠条件（每满十次，包括单抽和十连抽）
function checkBonusEligibility(){
  // 检查从上一次触发到现在，是否跨过了任何10的倍数
  var lastMultiple = Math.floor(lastBonusDrawCount / 10) * 10; // 上一次触发时或之前的最近10的倍数
  var currentMultiple = Math.floor(totalDrawCount / 10) * 10; // 当前次数或之前的最近10的倍数
  if(currentMultiple > lastMultiple && currentMultiple > 0){
    bonusPending = true;
    lastBonusDrawCount = currentMultiple; // 更新上一次触发额外加赠的次数为最近的10的倍数
    // 立刻显示额外加赠提示页面
    openBonusTip();
  }
}

// 进行概率抽奖，获得额外加赠的奖励
function drawBonusReward(){
  var totalWeight = 0;
  for(var i = 0; i < BONUS_ITEM_POOL.length; i++){
    totalWeight += BONUS_ITEM_POOL[i].weight;
  }
  var random = Math.random() * totalWeight;
  var cumulative = 0;
  for(var i = 0; i < BONUS_ITEM_POOL.length; i++){
    cumulative += BONUS_ITEM_POOL[i].weight;
    if(random < cumulative){
      return BONUS_ITEM_POOL[i];
    }
  }
  return BONUS_ITEM_POOL[BONUS_ITEM_POOL.length - 1];
}

      pointsCount += e.data.points;
      updatePointsDisplay();
    }
    // 把获得的奖励存入暂存箱
    if(e.data.rewards && e.data.rewards.length > 0){
      for(var i = 0; i < e.data.rewards.length; i++){
        addToStorage(e.data.rewards[i]);
      }
    }
  }
  if(e.data && e.data.type === 'closeReward') closeReward();
  if(e.data && e.data.type === 'closeStorage') closeStorage();
  if(e.data && e.data.type === 'closeWarehouse') closeWarehouse();

    showSendToWarehouseReward(itemsToSend);
  }
  if(e.data && e.data.type === 'closeDecomposeReward') closeDecomposeReward();
  if(e.data && e.data.type === 'bonusTipConfirm') closeBonusTip();
  if(e.data && e.data.type === 'bonusRewardConfirm') closeBonusReward();
  if(e.data && e.data.type === 'mythicTipConfirm') closeMythicTip();
  if(e.data && e.data.type === 'mythicRewardConfirm') closeMythicReward();
  if(e.data && e.data.type === 'requestPoints'){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'updatePoints', points: pointsCount}, '*');
    }
  }
  if(e.data && e.data.type === 'requestStorageData'){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'storageData', items: storageItems, points: pointsCount}, '*');
    }
  }
  if(e.data && e.data.type === 'decomposeItems'){
    var points = e.data.points || 0;
    var items = e.data.items || [];
    // 加到首页积分
    if(points > 0){
      pointsCount += points;
      updatePointsDisplay();
    }
    // 从暂存箱中删除已分解的道具
    for(var i = 0; i < items.length; i++){
      for(var j = storageItems.length - 1; j >= 0; j--){
        if(storageItems[j].name === items[i].name){
          storageItems.splice(j, 1);
          break;
        }
      }
    }
    // 显示恭喜获得页面（复用购买成功弹窗样式）
    if(points > 0){
      showDecomposeRewardNew(points);
    }
    // 重新发送数据给暂存箱页面
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'decomposeSuccess', items: storageItems, points: pointsCount}, '*');
    }
  }
  if(e.data === 'closeGachaSingle'){
    closeGachaSingle();
  }else if(e.data === 'closeGachaTen'){
    closeGachaTen();
  }else if(e.data && e.data.type === 'gachaClose'){
    // 根据当前抽奖类型调用对应的关闭函数，避免同时调用两个导致竞态
    if(currentGachaType === 'single'){
      closeGachaSingle();
    }else if(currentGachaType === 'ten'){
      closeGachaTen();
    }
  }
  if(e.data && e.data.type === 'closeExchange'){
    playBackSound(); // 播放返回音效
    document.getElementById('exchangeModal').classList.remove('active');
  }
  if(e.data && e.data.type === 'closeRecharge') closeRecharge();
  if(e.data && e.data.type === 'requestCfmCoin'){
    updateCfmCoinDisplay();
  }
  if(e.data && e.data.type === 'openPayment'){
    openPayment(e.data.tier);
  }
  if(e.data && e.data.type === 'closePayment'){
    closePayment();
  }
  if(e.data && e.data.type === 'openExchangeConfirm'){
    openExchangeConfirm(e.data.product, e.data.price, e.data.qty);
  }
  if(e.data && e.data.type === 'closeExchangeConfirm'){
    closeExchangeConfirm();
  }
  if(e.data && e.data.type === 'exchangeConfirm'){
    // 执行兑换逻辑
    doExchange();
  }
  if(e.data && e.data.type === 'paymentSuccess'){
    var tierCoinsList = [3, 6, 30, 68, 128, 198, 328, 648];
    var coins = tierCoinsList[currentPaymentTier] || 1296;
    cfmCoinCount += coins;
    updateCfmCoinDisplay();
    // 不关闭弹窗，等用户点击成功提示页面后再关闭
  }
  if(e.data && e.data.type === 'tryBuy'){
    // 直接打开二次确认页面，CFM币检查放在确认购买后
    currentBuyTier = parseInt(e.data.tier) || 0;
    openConfirm();
  }
  if(e.data && e.data.type === 'openConfirm'){
    currentBuyTier = parseInt(e.data.tier) || 0;
    openConfirm();
  }
  if(e.data && e.data.type === 'closeBuySuccess'){
    closeBuySuccess();
  }
  if(e.data && e.data.type === 'closeConfirm'){
    closeConfirm();
    if(e.data.action === 'confirm'){
      var tierConfig = BUY_TIERS[currentBuyTier] || BUY_TIERS[0];
      var addCoins = tierConfig.reward_count;
      var costCoins = tierConfig.price;
      if(cfmCoinCount < costCoins){
        // CFM不够，关闭购买页面并打开充值页面
        setTimeout(function(){ closeShop(); openRecharge(); }, 100);
      } else {
        // CFM足够，扣除CFM币并增加抽奖币
        gachaCoinCount += addCoins;
        cfmCoinCount -= costCoins;
        updateGachaCoinDisplay();
        updateCfmCoinDisplay();
        // 显示恭喜获得弹窗
        setTimeout(function(){ showBuySuccess(addCoins); }, 200);
      }
    }
  }
});
</script>

<script>
var shopTpl = document.getElementById('shopTpl').value;

/* ===== 购买：完全独立 ===== */
function openShop(){
  var iframe = document.getElementById('shopIframe');
  var modal = document.getElementById('shopModal');
  // 先清空iframe，避免多次打开累积内容导致黑屏
  iframe.srcdoc = '';
  iframe.onload = function(){
    // 只有当srcdoc是shopTpl时才显示，避免清空时触发onload
    if(iframe.srcdoc && iframe.srcdoc.length > 100){
      modal.className = 'shop-modal shop-show';
    }
  };
  // 从 BUY_TIERS 生成价格数组，替换模板里的硬编码（确保改动 buy_tiers.js 后显示价格同步更新）
  var tierPricesStr = BUY_TIERS.map(function(t){ return t.price; }).join(', ');
  var shopHtml = shopTpl.replace('var tierPrices = [6, 50, 328, 648];', 'var tierPrices = [' + tierPricesStr + '];');
  // 延迟设置srcdoc，确保先清空
  setTimeout(function(){
    iframe.srcdoc = shopHtml;
  }, 10);
  // 超时保护，确保一定能显示
  setTimeout(function(){
    if(!modal.classList.contains('shop-show')){
      modal.className = 'shop-modal shop-show';
    }
  }, 500);
}
function closeShop(){
  // 关闭音效已在shopTpl的关闭按钮click事件中播放（零帧起手），这里不再重复播放
  var modal = document.getElementById('shopModal');
  var iframe = document.getElementById('shopIframe');
  modal.className = 'shop-modal';
  // 延迟清空iframe，确保隐藏动画完成后再清空
  setTimeout(function(){
    iframe.srcdoc = '';
  }, 300);
}
/* ===== 充值弹窗：完全独立 ===== */
function openRecharge(){
  playOpenSound(); // 播放打开音效
  var modal = document.getElementById('rechargeModal');
  var iframe = document.getElementById('rechargeIframe');
  iframe.onload = function(){
    modal.className = 'recharge-modal recharge-show';
  };
  iframe.src = 'pages/recharge.html?t=' + Date.now();
  setTimeout(function(){
    if(!modal.classList.contains('recharge-show')){
      modal.className = 'recharge-modal recharge-show';

  }, 300);

function openConfirm(){

    loaded = true;
    modal.className = 'confirm-modal confirm-show';

  iframe.src = 'pages/buy_confirm.html?tier=' + currentPaymentTier + '&t=' + Date.now();

      modal.className = 'payment-modal payment-show';
      try{

      }catch(e){}

  }, 800);
}

  iframe.onload = null;
  iframe.src = 'about:blank';
}
/* ===== 兑换成功弹窗：完全独立 ===== */
function openExchangeConfirm(product, price, qty){
  // 保存当前兑换信息
  currentExchangeProduct = product || '';
  currentExchangePrice = price || 0;
  currentExchangeQty = qty || 1;
  
  var modal = document.getElementById('exchangeConfirmModal');
  var iframe = document.getElementById('exchangeConfirmIframe');
  var loaded = false;
  iframe.onload = function(){
    loaded = true;
    // 向兑换确认页面传递兑换信息
    iframe.contentWindow.postMessage({
      type: 'setExchangeInfo',
      product: currentExchangeProduct,
      price: currentExchangePrice,
      qty: currentExchangeQty
    }, '*');
    modal.className = 'exchange-confirm-modal exchange-confirm-show';
  };
  iframe.src = 'pages/exchange_confirm.html?t=' + Date.now();
  setTimeout(function(){
    if(!loaded){
      modal.className = 'exchange-confirm-modal exchange-confirm-show';
    }
  }, 800);
}

  document.getElementById('exchangeConfirmModal').className = 'exchange-confirm-modal';
  var iframe = document.getElementById('exchangeConfirmIframe');
  iframe.onload = null;
  iframe.src = 'about:blank';
}

// 显示兑换失败弹窗
function showExchangeFail(title, msg){
  var mask = document.getElementById('exchangeFailMask');
  if(mask){
    document.getElementById('exchangeFailTitle').textContent = title || '兑换失败';
    document.getElementById('exchangeFailMsg').textContent = msg || '兑换币不足';
    mask.style.display = 'flex';
  }
}

// 关闭兑换失败弹窗
function closeExchangeFail(){
  var mask = document.getElementById('exchangeFailMask');
  if(mask) mask.style.display = 'none';
}



// 执行兑换逻辑
function doExchange(){
  if(!currentExchangeProduct){
    closeExchangeConfirm();
    return;
  }
  
  var totalCost = currentExchangePrice * currentExchangeQty;
  
  // 检查兑换币是否足够
  if(pointsCount < totalCost){
    showExchangeFail('兑换失败', '需要' + totalCost + '兑换币，当前只有' + pointsCount + '兑换币');
    closeExchangeConfirm();
    return;
  }
  
  // 扣除兑换币
  pointsCount -= totalCost;
  updatePointsDisplay();
  
  // 获取道具信息
  var itemInfo = EXCHANGE_ITEMS_MAP[currentExchangeProduct] || {image: '', quality: 'gold'};
  
  // 构造道具对象
  var item = {
    name: itemInfo.name || currentExchangeProduct,
    count: currentExchangeQty,
    quality: itemInfo.quality,
    image: itemInfo.image,
    showcase: itemInfo.showcase || false
  };
  
  // 关闭兑换确认弹窗
  closeExchangeConfirm();
  
  // 显示恭喜获得页面（参考暂存箱发放仓库单个道具的代码）
  showSendToWarehouseReward([item]);
}

/* ===== 监听postMessage ===== */
window.addEventListener('message', function(e){
  if(e.data === 'closeShop') closeShop();
});
</script>
